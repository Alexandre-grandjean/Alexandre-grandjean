<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Alexandre Grandjean — développeur web">
  <rect width="1200" height="280" fill="#030409"/>

  <!-- repères de coin -->
  <g stroke="#9fc4f0" stroke-opacity="0.55" stroke-width="1.2" fill="none">
    <path d="M28 52 V28 H52"/>
    <path d="M1148 28 H1172 V52"/>
    <path d="M28 228 V252 H52"/>
    <path d="M1172 228 V252 H1148"/>
  </g>

  <!-- constellation -->
  <g stroke="#9fc4f0" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5" fill="none">
    <path d="M905 96 L1002 158"/>
    <path d="M1002 158 L1092 88"/>
  </g>
  <g fill="#9fc4f0">
    <circle cx="905" cy="96" r="3"/>
    <circle cx="1002" cy="158" r="4.2"/>
    <circle cx="1092" cy="88" r="2.4"/>
  </g>
  <g fill="#e6ecf5" opacity="0.25">
    <circle cx="846" cy="146" r="1.3"/>
    <circle cx="1136" cy="164" r="1.1"/>
    <circle cx="962" cy="58" r="1"/>
  </g>

  <!-- nom -->
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="400" letter-spacing="1.2" fill="#e6ecf5">Alexandre Grandjean</text>

  <!-- sous-titre -->
  <text x="66" y="170" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="4.2" fill="#7f8da3">DÉVELOPPEUR WEB — WEB@CADÉMIE BY EPITECH</text>

  <!-- filet -->
  <line x1="64" y1="212" x2="1136" y2="212" stroke="#a0b9dc" stroke-opacity="0.16" stroke-width="1"/>

  <!-- légendes basses -->
  <text x="64" y="238" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="#5d6a7d">PORTFOLIO — 2026</text>
  <text x="1136" y="238" text-anchor="end" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#5d6a7d">ALEXANDRE-GRANDJEAN.GITHUB.IO/PORTFOLIO</text>
